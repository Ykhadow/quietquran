name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    # The golden images were drawn on Windows; text renders a little
    # differently on other systems.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
